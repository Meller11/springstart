<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Udviklerne</title>
    <style>
        /* Body styling */
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            padding: 20px;
        }

        /* Header styling */
        h1 {
            font-size: 2.5em;
            color: #333;
            margin-bottom: 10px;
        }

        h2 {
            color: #666;
        }

        /* Developer container styling */
        .developers-container {
            display: flex;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
            max-width: 1200px; /* Øget bredde på containeren */
            margin-top: 20px;
        }

        /* Developer card styling */
        .developer-card {
            background-color: #ffffff;
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 250px; /* Øget bredde på kortet */
            height: 350px; /* Øget højde på kortet */
        }

        /* Circle image styling */
        .developer-card img {
            width: 150px; /* Øget størrelse på billedet */
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 20px;
        }

        /* Name and age styling */
        .developer-name {
            font-size: 1.5em; /* Øget skriftstørrelse */
            font-weight: bold;
            color: #333;
            margin: 10px 0 5px;
        }

        .developer-age {
            color: #777;
            font-size: 1.1em; /* Øget skriftstørrelse */
            margin-bottom: 15px;
        }

        /* Add Developer button styling */
        #add-developer-btn {
            background-color: #4285f4; /* Google's blue */
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 5px;
            font-size: 18px; /* Øget skriftstørrelse */
            cursor: pointer;
            box-shadow: 0px 2px 5px rgba(0, 0, 0, 0.2);
            margin-top: 30px;
        }

        #add-developer-btn:hover {
            background-color: #357ae8;
        }

        /* Modal styling */
        #add-developer-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: #ffffff;
            padding: 20px;
            border-radius: 8px;
            width: 300px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.3);
        }

        /* Close button */
        .close-btn {
            background-color: #f44336;
            color: white;
            padding: 5px 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            float: right;
        }

        .close-btn:hover {
            background-color: #d32f2f;
        }
    </style>
</head>
<body>
<h1>Udviklerne</h1>
<h2>Mød udviklerne uden noget liv</h2>

<div class="developers-container" id="developers-container"></div>

<button id="add-developer-btn">Add Developer</button>

<!-- Modal for adding a developer -->
<div id="add-developer-modal">
    <div class="modal-content">
        <button class="close-btn" id="close-modal-btn">X</button>
        <h2>Add Developer</h2>
        <form id="add-developer-form" enctype="multipart/form-data">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required><br><br>

            <label for="age">Age:</label>
            <input type="number" id="age" name="age" required><br><br>

            <label for="image">Upload Image:</label>
            <input type="file" id="image" name="image" accept="image/*" required><br><br>

            <button type="submit">Add Developer</button>
        </form>
        <div id="message"></div>
    </div>
</div>

<script>
    // Show the modal when the "Add Developer" button is clicked
    document.getElementById('add-developer-btn').addEventListener('click', () => {
        document.getElementById('add-developer-modal').style.display = 'flex';
    });

    // Close the modal
    document.getElementById('close-modal-btn').addEventListener('click', () => {
        document.getElementById('add-developer-modal').style.display = 'none';
    });

    // Handle form submission
    document.getElementById('add-developer-form').addEventListener('submit', function(event) {
        event.preventDefault();

        const formData = new FormData();
        formData.append('name', document.getElementById('name').value);
        formData.append('age', document.getElementById('age').value);
        formData.append('image', document.getElementById('image').files[0]);

        fetch('/developer/add', {
            method: 'POST',
            body: formData
        })
            .then(response => {
                if (!response.ok) {
                    throw new Error('Failed to add developer');
                }
                return response.json();
            })
            .then(data => {
                document.getElementById('message').textContent = 'Developer added successfully!';
                document.getElementById('message').style.color = 'green';
                document.getElementById('add-developer-form').reset();
                document.getElementById('add-developer-modal').style.display = 'none';
                loadDevelopers(); // Refresh developer list
            })
            .catch(error => {
                console.error('Error:', error);
                document.getElementById('message').textContent = 'Failed to add developer. Please try again.';
                document.getElementById('message').style.color = 'red';
            });
    });

    // Function to load and display developers
    function loadDevelopers() {
        fetch('/developers')
            .then(response => {
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                return response.json();
            })
            .then(data => {
                const container = document.getElementById('developers-container');
                container.innerHTML = ''; // Clear existing content

                data.forEach(developer => {
                    const developerCard = document.createElement('div');
                    developerCard.className = 'developer-card';

                    const imageElement = document.createElement('img');
                    imageElement.src = developer.image ? 'data:image/jpeg;base64,' + developer.image : 'placeholder.jpg';
                    imageElement.alt = 'Developer Image';
                    developerCard.appendChild(imageElement);

                    const nameElement = document.createElement('div');
                    nameElement.className = 'developer-name';
                    nameElement.textContent = developer.name;
                    developerCard.appendChild(nameElement);

                    const ageElement = document.createElement('div');
                    ageElement.className = 'developer-age';
                    ageElement.textContent = 'Age: ' + developer.age;
                    developerCard.appendChild(ageElement);

                    container.appendChild(developerCard);
                });
            })
            .catch(error => {
                console.error('Error fetching developers:', error);
            });
    }

    // Load developers when the page loads
    window.onload = loadDevelopers;
</script>
</body>
</html>
